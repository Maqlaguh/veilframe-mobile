<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#17191e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/veilframe-mobile/veilframe-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/veilframe-mobile/veilframe-icon.png" />
    <title>VeilFrame Lite</title>
  </head>
  <body>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="app">
      <header class="app-header">
        <div class="brand"><img src="/veilframe-mobile/veilframe-icon.png" alt="" /><span>VeilFrame</span><small>Lite</small></div>
        <label class="file-button">動画を開く<input id="fileInput" type="file" accept="video/*,.mp4,.mov,.m4v" /></label>
      </header>

      <main>
        <section class="viewer card">
          <div id="stage" class="stage"><video id="video" playsinline></video><div id="cropBox" class="crop-box" hidden></div><p id="emptyHint">動画を開くと、ここで再生できます</p></div>
          <div class="player-controls"><button id="playButton">再生</button><input id="seekBar" aria-label="再生位置" type="range" min="0" max="1" value="0" step="0.01" /><span id="playbackTime">00:00.0 / 00:00.0</span></div>
          <div id="fileInfo" class="file-info">iOS 26対応・端末内処理</div>
        </section>

        <section class="card controls">
          <h2>映像</h2>
          <div class="button-row">
            <button id="rotateLeft">左へ90°</button><button id="rotateRight">右へ90°</button>
            <button id="rotationReset">元の向き</button><span id="rotationLabel" class="value">0°</span>
          </div>
          <div class="crop-actions"><button id="cropToggle">画面トリミングを指定</button><button id="cropReset" hidden>切り抜きを解除</button></div>
          <div id="cropPanel" class="crop-panel" hidden>
            <label>左 <output id="cropLeftLabel">0%</output><input id="cropLeft" type="range" min="0" max="90" value="0" step="0.5" /></label>
            <label>右 <output id="cropRightLabel">0%</output><input id="cropRight" type="range" min="0" max="90" value="0" step="0.5" /></label>
            <label>上 <output id="cropTopLabel">0%</output><input id="cropTop" type="range" min="0" max="90" value="0" step="0.5" /></label>
            <label>下 <output id="cropBottomLabel">0%</output><input id="cropBottom" type="range" min="0" max="90" value="0" step="0.5" /></label>
            <p id="cropInfo">出力範囲: 全画面</p>
            <button id="cropApply" class="crop-apply">この範囲を使用</button>
          </div>
          <div class="trim-grid">
            <label>開始 <output id="startLabel">00:00.0</output><input id="trimStart" type="range" min="0" max="1" value="0" step="0.01" /></label>
            <label>終了 <output id="endLabel">00:00.0</output><input id="trimEnd" type="range" min="0" max="1" value="1" step="0.01" /></label>
          </div>
          <div class="button-row"><button id="startHere">現在位置を開始に</button><button id="endHere">現在位置を終了に</button><button id="trimReset">全長に戻す</button></div>
        </section>

        <section class="card controls">
          <div class="section-title"><h2>音声診断</h2><button id="analyzeAudio">解析する</button></div>
          <div id="audioResult" class="diagnosis">動画を開くと左右の音量を解析できます</div>
          <label class="select-label">音声補正
            <select id="audioMode">
              <option value="none">補正なし</option>
              <option value="right_both">右音声を左右へ</option>
              <option value="left_both">左音声を左右へ</option>
              <option value="balance">左右を安全に自動均衡</option>
            </select>
          </label>
        </section>

        <section class="card export-card">
          <div class="section-title"><h2>MP4書き出し</h2><span class="privacy">動画は端末外へ送信しません</span></div>
          <button id="exportButton" class="primary">H.264/AAC MP4を書き出す</button>
          <button id="cancelButton" class="danger" hidden>処理を停止</button>
          <button id="saveButton" class="save" hidden>完成したMP4を保存・共有</button>
          <div class="progress-line"><progress id="progress" max="100" value="0"></progress><span id="progressLabel">待機中</span></div>
          <p id="status" class="status">まず動画を開いてください</p>
        </section>

        <section class="notice">
          <strong>VeilFrame Lite 0.1</strong>　動画を端末外へ送信せず、回転・時間指定・画面トリミング・左右音声補正・MP4保存を行います。
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
